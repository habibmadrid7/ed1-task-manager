<!DOCTYPE html>
<html lang="en">
<head>
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem("ed1-theme")||"light";var a=localStorage.getItem("ed1-accent");if(a)d.dataset.accent=a;}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3864'/%3E%3Cpath d='M9 16l5 5 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Executive Task Manager</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="loading-screen"><div class="brand-logo brand-logo-lg"></div><div class="loading-ring"></div><p class="loading-text" id="msg">Loading…</p></div>
<script src="config.js"></script>
<script>
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "login.html"; return; }
  const { data:p } = await sb.from("profiles").select("role, must_change_password").eq("id", session.user.id).single();
  if(!p){ await sb.auth.signOut(); window.location.href="login.html"; return; }
  if(p.must_change_password){ window.location.href="change-password.html"; return; }
  window.location.href = p.role==="superadmin" ? "modules/superadmin/dashboard.html" : "modules/admin/dashboard.html";
})();
</script>
</body>
</html>
