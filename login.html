<!DOCTYPE html>
<html lang="en">
<head>
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem("ed1-theme")||"light";var a=localStorage.getItem("ed1-accent");if(a)d.dataset.accent=a;}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3864'/%3E%3Cpath d='M9 16l5 5 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Executive Task Manager — Sign in</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-wrap">
  <button class="theme-fab" onclick="toggleTheme()" title="Light / dark"><span id="themeIcon">🌙</span></button>
  <div class="auth-card">
    <div class="auth-logo"><div class="brand-logo brand-logo-xl"></div></div>
    <h1 class="auth-title">Executive Task Manager</h1>
    <p class="auth-sub">Rumbu Industries Group &bull; Sign in</p>

    <label>Email address</label>
    <input type="email" id="email" autocomplete="username" placeholder="your@email.com"
      onkeydown="if(event.key==='Enter'){document.getElementById('password').focus();}">

    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••"
      onkeydown="if(event.key==='Enter'){login();}">

    <button class="btn btn-primary btn-block" id="loginBtn" style="margin-top:20px" onclick="login()">Sign in</button>
    <div class="status" id="status"></div>
    <p class="auth-sub" style="margin-top:20px">Accounts are created by the administrator. Contact the office for access.</p>
    <div class="swatches" style="margin-top:18px">
      <button class="swatch sw-blue" data-accent="blue" title="Blue" onclick="setAccent('blue')"></button>
      <button class="swatch sw-emerald" data-accent="emerald" title="Emerald" onclick="setAccent('emerald')"></button>
      <button class="swatch sw-violet" data-accent="violet" title="Violet" onclick="setAccent('violet')"></button>
      <button class="swatch sw-amber" data-accent="amber" title="Amber" onclick="setAccent('amber')"></button>
      <button class="swatch sw-teal" data-accent="teal" title="Teal" onclick="setAccent('teal')"></button>
      <button class="swatch sw-rose" data-accent="rose" title="Rose" onclick="setAccent('rose')"></button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>(function(){var i=document.getElementById("themeIcon"); if(i) i.textContent=currentTheme()==="dark"?"☀":"🌙"; if(typeof markAccent==="function") markAccent();})();</script>
<script>
async function login(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const status = document.getElementById("status");
  const btn = document.getElementById("loginBtn");
  if(!email || !password){ status.className="status err"; status.textContent="Enter your email and password."; return; }

  btn.disabled = true; btn.textContent = "Signing in...";
  status.className = "status"; status.textContent = "";
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ status.className="status err"; status.textContent="Invalid email or password."; btn.disabled=false; btn.textContent="Sign in"; return; }

    const { data: p } = await sb.from("profiles").select("role, must_change_password").eq("id", data.user.id).single();
    status.className="status ok"; status.textContent="Signed in. Loading...";
    if(p && p.must_change_password){ window.location.href = "change-password.html"; return; }
    window.location.href = (p && p.role === "superadmin")
      ? "modules/superadmin/dashboard.html"
      : "modules/admin/dashboard.html";
  }catch(e){
    status.className="status err"; status.textContent="Error: " + (e.message || e);
    btn.disabled=false; btn.textContent="Sign in";
  }
}
// If already signed in, skip the login form.
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if(session){
    const { data:p } = await sb.from("profiles").select("role, must_change_password").eq("id", session.user.id).single();
    if(p && p.must_change_password){ window.location.href="change-password.html"; return; }
    if(p){ window.location.href = p.role==="superadmin" ? "modules/superadmin/dashboard.html" : "modules/admin/dashboard.html"; }
  }
})();
</script>
</body>
</html>
