<!DOCTYPE html>
<html lang="en">
<head>
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem("ed1-theme")||"light";var a=localStorage.getItem("ed1-accent");if(a)d.dataset.accent=a;}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3864'/%3E%3Cpath d='M9 16l5 5 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Executive Task Manager — Set your password</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-wrap">
  <button class="theme-fab" onclick="toggleTheme()" title="Light / dark"><span id="themeIcon">🌙</span></button>
  <div class="auth-card">
    <div class="auth-logo"><div class="brand-logo brand-logo-xl"></div></div>
    <h1 class="auth-title">Set your password</h1>
    <p class="auth-sub" id="welcome">Password change required</p>

    <div class="callout" style="margin-bottom:8px">You signed in with a temporary password. Set a new one to continue — you cannot use the app until you do.</div>

    <label>New password</label>
    <input type="password" id="newpw" autocomplete="new-password" placeholder="At least 8 characters">
    <label>Confirm new password</label>
    <input type="password" id="confirmpw" autocomplete="new-password" placeholder="Re-enter new password"
      onkeydown="if(event.key==='Enter'){setPassword();}">

    <button class="btn btn-primary btn-block" id="saveBtn" style="margin-top:20px" onclick="setPassword()">Set new password</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script src="config.js"></script>
<script>(function(){var i=document.getElementById("themeIcon"); if(i) i.textContent=currentTheme()==="dark"?"☀":"🌙";})();</script>
<script>
const MIN = 8;
let ME = null;

(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.href = "login.html"; return; }
  const { data:p } = await sb.from("profiles").select("id, full_name, role, must_change_password").eq("id", session.user.id).single();
  if(!p){ await sb.auth.signOut(); window.location.href="login.html"; return; }
  ME = p;
  // Already changed — no reason to be here.
  if(!p.must_change_password){ goDashboard(); return; }
  document.getElementById("welcome").textContent = "Welcome, " + (p.full_name || "");
})();

function goDashboard(){
  window.location.href = ME && ME.role === "superadmin"
    ? "modules/superadmin/dashboard.html"
    : "modules/admin/dashboard.html";
}

async function setPassword(){
  const npw = document.getElementById("newpw").value;
  const cpw = document.getElementById("confirmpw").value;
  const status = document.getElementById("status");
  const btn = document.getElementById("saveBtn");

  if(npw.length < MIN){ status.className="status err"; status.textContent="Password must be at least "+MIN+" characters."; return; }
  if(npw !== cpw){ status.className="status err"; status.textContent="Passwords do not match."; return; }

  btn.disabled = true; btn.textContent = "Saving...";
  status.className="status"; status.textContent="";
  try{
    // 1) Update the account password (runs as the signed-in user).
    const { error: pwErr } = await sb.auth.updateUser({ password: npw });
    if(pwErr){ status.className="status err"; status.textContent=pwErr.message; btn.disabled=false; btn.textContent="Set new password"; return; }

    // 2) Clear the forced-change flag and delete the stored temporary password.
    const { error: profErr } = await sb.from("profiles")
      .update({ must_change_password: false, temp_password: null })
      .eq("id", ME.id);
    if(profErr){ status.className="status err"; status.textContent=profErr.message; btn.disabled=false; btn.textContent="Set new password"; return; }

    status.className="status ok"; status.textContent="Password updated. Loading your dashboard...";
    setTimeout(goDashboard, 900);
  }catch(e){
    status.className="status err"; status.textContent="Error: " + (e.message || e);
    btn.disabled=false; btn.textContent="Set new password";
  }
}
</script>
</body>
</html>
